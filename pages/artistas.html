        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img class="logo-main" src="../img/logo_main.png" alt="logo de la empresa">
                </a>
                <button class="navbar-toggler ms-auto hamburgesa" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    ☰
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link btn-inicio" aria-current="page" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link btn-inicio" href="./nuestros_productos.html">Nuestros Productos</a>

                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <h1 class="title">Los artistas que nos eligen</h1>
        <div class="movil">
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="../img/jimmy_page.jpg" class="d-block w-100" alt="Jimmy Page tocando en vivo">
                        <figcaption>Jimmy Page - Led Zeppelin</figcaption>
                    </div>
                    <div class="carousel-item">
                        <img src="../img/david_gilmour.jpg" class="d-block w-100"
                            alt="David Gilmour con su guitarra stratocaster">
                        <figcaption>David Gilmour - Pink Floyd</figcaption>
                    </div>
                    <div class="carousel-item">
                        <img src="../img/neil_peart.jpg" class="d-block w-100"
                            alt="Neil Peart tocando en vivo en un show de Rush">
                        <figcaption>Neil Peart - Rush</figcaption>
                    </div>
                    <div class="carousel-item">
                        <img src="../img/steve_harris.jpg" class="d-block w-100"
                            alt="Steve Harris con su bajo Precision en un show en vivo">
                        <figcaption>Steve Harris - Iron Maiden</figcaption>
                    </div>
                    <div class="carousel-item">
                        <img src="../img/wes_borland.jpg" class="d-block w-100"
                            alt="Wes Borland tocando la guitarra en vivo">
                        <figcaption>Wes Borland - Limp Bizkit</figcaption>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <div class="escritorio">
            <section class="grid-section-artista">
                <h2 class="subtitle titulo_artistas">Galería de músicos</h2>
                <div class="foto_artista1">
                    <figure data-aos="fade-right" data-aos-duration="800" tabindex="0">
                        <img src="../img/jimmy_page.jpg" alt="Jimmy Page tocando en vivo">
                        <figcaption>Jimmy Page - Led Zeppelin</figcaption>
                    </figure>
                </div>
                <div class="foto_artista2">
                    <figure data-aos="fade-right" data-aos-duration="800" tabindex="0">
                        <img src="../img/david_gilmour.jpg" alt="David Gilmour con su guitarra stratocaster">
                        <figcaption>David Gilmour - Pink Floyd</figcaption>
                    </figure>
                </div>
                <div class="foto_artista3">
                    <figure data-aos="fade-left" data-aos-duration="800" tabindex="0">
                        <img src="../img/neil_peart.jpg" alt="Neil Peart tocando en vivo en un show de Rush">
                        <figcaption>Neil Peart - Rush</figcaption>
                    </figure>
                </div>
                <div class="foto_artista4">
                    <figure data-aos="fade-left" data-aos-duration="800" tabindex="0">
                        <img src="../img/wes_borland.jpg" alt="Wes Borland tocando la guitarra en vivo">
                        <figcaption>Wes Borland - Limp Bizkit</figcaption>
                    </figure>
                </div>
                <div class="foto_artista5">
                    <figure data-aos="fade-left" data-aos-duration="800" tabindex="0">
                        <img src="../img/steve_harris.jpg" alt="Steve Harris con su bajo Precision en un show en vivo">
                        <figcaption>Steve Harris - Iron Maiden</figcaption>
                    </figure>
                </div>
            </section>
        </div>

                        alt="logo de Facebook"></a></li>
